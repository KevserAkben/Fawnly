spring:
  application:
    name: fawnly

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fawnly}
    username: ${DB_USERNAME:fawnly}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME:your-email@gmail.com}
    password: ${GMAIL_APP_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 22MB

server:
  port: ${SERVER_PORT:8080}

fawnly:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-256-bit-secret-key-minimum-32-chars!!}
    access-token-expiration-ms: 86400000
    refresh-token-expiration-ms: 604800000
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  scan:
    temp-dir: ${SCAN_TEMP_DIR:/tmp/sast-scans}
    semgrep-path: ${SEMGREP_PATH:semgrep}
    rules-path: ${SEMGREP_RULES_PATH:rules/owasp_java.yaml}
  rate-limit:
    requests-per-minute: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.fawnly: INFO
    org.springframework.security: WARN
